name: Scheduler

# The one job that posts. It stays awake for ~5h40m, checking every 5 minutes what is
# due (see scheduler.py), then starts its next run. An hourly trigger restarts it if a
# run is ever lost; extra triggers simply wait their turn (one run at a time).
on:
  push:
    branches: [main]
    paths:
      - scheduler.py
      - .github/workflows/scheduler.yml
  workflow_dispatch:
  schedule:
    - cron: "3 * * * *"
    - cron: "33 * * * *"

permissions:
  contents: write   # the daily planner commits trends.json
  actions: write    # start Build reels, and this workflow's next run

concurrency:
  group: scheduler
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
      START_DATE: ${{ vars.START_DATE }}
      TREND_START_DATE: ${{ vars.TREND_START_DATE }}
      GRAPH_BASE: ${{ vars.GRAPH_BASE }}
      POST_STORY: ${{ vars.POST_STORY || 'true' }}
      POST_FIRST_COMMENT: ${{ vars.POST_FIRST_COMMENT || 'false' }}
      GH_TOKEN: ${{ github.token }}
      RUN_MINUTES: "340"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Post what's due, every 5 minutes
        run: PYTHONUNBUFFERED=1 python scheduler.py

      - name: Start the next run
        if: always()
        run: gh workflow run scheduler.yml --ref main
