name: Build reels

# Makes all 11 reels (plus the carousel slides) on GitHub's servers and publishes
# them to GitHub Pages, so Instagram can download them from a public link:
#   https://<user>.github.io/<repo>/reels/puzzle_twister_dayNN_reel.mp4
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - puzzles.json
      - render.py
      - reels.py
      - reels2.py
      - trend.py
      - trends.json
      - trends_common.py
      - psych_samples.py
      - .github/workflows/build-reels.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true   # a newer push replaces a build that is still running

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FONT_DIR: ${{ github.workspace }}/fonts
      KOKORO_DIR: ${{ github.workspace }}/models
      REELS_OUT: ${{ github.workspace }}/site/reels
      REELS_TMP: ${{ github.workspace }}/tmp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        timeout-minutes: 12
        run: |
          # The Ubuntu mirror is sometimes very slow; give apt a short leash, then fall back
          # to a static ffmpeg build.
          apt_opts="-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          if timeout 300 sudo apt-get $apt_opts update -q && timeout 300 sudo apt-get $apt_opts install -y -q --no-install-recommends ffmpeg; then
            echo "ffmpeg from apt"
          else
            echo "apt was too slow; downloading a static ffmpeg build"
            mkdir -p "$RUNNER_TEMP/ffmpeg"
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/ffmpeg.tar.xz" https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
            tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP/ffmpeg" --strip-components=1
            echo "$RUNNER_TEMP/ffmpeg" >> "$GITHUB_PATH"
          fi

      - name: Check ffmpeg
        run: ffmpeg -hide_banner -version | head -1

      - name: Install Python packages
        run: pip install pillow numpy soundfile kokoro-onnx

      - name: Download Poppins fonts
        run: |
          mkdir -p "$FONT_DIR"
          for f in Bold Medium Regular; do
            curl -fsSL -o "$FONT_DIR/Poppins-$f.ttf" "https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-$f.ttf"
          done

      - name: Cache Kokoro voice model
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0

      - name: Download Kokoro voice model
        run: |
          mkdir -p "$KOKORO_DIR"
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -f "$KOKORO_DIR/kokoro-v1.0.onnx" ] || curl -fsSL -o "$KOKORO_DIR/kokoro-v1.0.onnx" "$base/kokoro-v1.0.onnx"
          [ -f "$KOKORO_DIR/voices-v1.0.bin" ]  || curl -fsSL -o "$KOKORO_DIR/voices-v1.0.bin"  "$base/voices-v1.0.bin"

      - name: Check puzzles
        run: python verify.py

      - name: Render carousel slides
        run: python render.py

      - name: Build reels
        run: |
          mkdir -p "$REELS_OUT" "$REELS_TMP"
          python reels2.py all
          ls -la "$REELS_OUT"
          test "$(ls "$REELS_OUT"/*.mp4 | wc -l)" -eq 11

      - name: Build trend series (trends.json)
        # A failure here stops the deploy, so the site that is already live (with today's trend
        # reels) stays up instead of being replaced by one without them.
        env:
          EMOJI_FONT: ${{ github.workspace }}/fonts/NotoColorEmoji.ttf
          TREND_OUT: ${{ github.workspace }}/site/trend
        run: |
          # Noto Color Emoji (bitmap version that Pillow can draw): Ubuntu package first, then GitHub tags.
          if timeout 180 sudo apt-get install -y -q --no-install-recommends fonts-noto-color-emoji \
             && [ -f /usr/share/fonts/truetype/noto/NotoColorEmoji.ttf ]; then
            cp /usr/share/fonts/truetype/noto/NotoColorEmoji.ttf "$EMOJI_FONT"
          else
            for tag in v2.047 v2.042 v2.038; do
              curl -fsSL --retry 2 -o "$EMOJI_FONT" "https://raw.githubusercontent.com/googlefonts/noto-emoji/$tag/fonts/NotoColorEmoji.ttf" && break
            done
          fi
          ls -la "$EMOJI_FONT"
          python trend.py
          ls "$TREND_OUT"/*.mp4 | wc -l

      - name: Build psychology samples (not scheduled)
        continue-on-error: true
        env:
          EMOJI_FONT: ${{ github.workspace }}/fonts/NotoColorEmoji.ttf
          PSYCH_OUT: ${{ github.workspace }}/site/samples/psych
        run: python psych_samples.py

      - name: Assemble site
        run: |
          mkdir -p site/slides site/covers site/previews
          cp -r out/day_* site/slides/
          cp out/covers/*.jpg site/covers/
          cp "$REELS_TMP"/v2_day*_end.png "$REELS_TMP"/v2_day*_reveal.png site/previews/ || true
          test "$(ls site/covers/*.jpg | wc -l)" -eq 11
          {
            echo '<!doctype html><meta charset="utf-8"><title>Puzzle Twister reels</title>'
            echo '<h1>Puzzle Twister reels</h1><ul>'
            for f in site/reels/*.mp4; do n=$(basename "$f"); echo "<li><a href=\"reels/$n\">$n</a></li>"; done
            echo '</ul><h2>Covers</h2><ul>'
            for f in site/covers/*.jpg; do n=$(basename "$f"); echo "<li><a href=\"covers/$n\">$n</a></li>"; done
            echo '</ul>'
          } > site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
