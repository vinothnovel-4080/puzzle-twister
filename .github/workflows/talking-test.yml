name: Talking presenter test

# TEST ONLY - not part of daily posting. Makes one presenter (presenters/presenters.json)
# say a line: the saved voice (voices.py) speaks it, then SadTalker (open source) animates
# the saved portrait to match. The video is saved as a download on the run page and on the
# "talk-tests" branch. Runs when presenters/talk_test.json or this file changes, or by hand.
on:
  workflow_dispatch:
    inputs:
      presenter:
        description: "Presenter (ananya or sophie). Empty = presenters/talk_test.json"
        required: false
      text:
        description: "What she says. Empty = presenters/talk_test.json"
        required: false
  push:
    branches: [main]
    paths:
      - presenters/talk_test.json
      - .github/workflows/talking-test.yml

permissions:
  contents: write   # save the result on the talk-tests branch

concurrency:
  group: talking-test
  cancel-in-progress: true

jobs:
  talk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KOKORO_DIR: ${{ github.workspace }}/models
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ffmpeg
        timeout-minutes: 12
        run: |
          apt_opts="-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          if timeout 300 sudo apt-get $apt_opts update -q && timeout 300 sudo apt-get $apt_opts install -y -q --no-install-recommends ffmpeg; then
            echo "ffmpeg from apt"
          else
            mkdir -p "$RUNNER_TEMP/ffmpeg"
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/ffmpeg.tar.xz" https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
            tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP/ffmpeg" --strip-components=1
            echo "$RUNNER_TEMP/ffmpeg" >> "$GITHUB_PATH"
          fi

      - name: Work out presenter and line
        id: job
        env:
          IN_PRESENTER: ${{ inputs.presenter }}
          IN_TEXT: ${{ inputs.text }}
        run: |
          python - <<'EOF'
          import json, os
          cfg = json.load(open("presenters/talk_test.json", encoding="utf-8"))
          who = (os.environ.get("IN_PRESENTER") or cfg["presenter"]).strip().lower()
          text = (os.environ.get("IN_TEXT") or cfg["text"]).strip()
          p = json.load(open("presenters/presenters.json", encoding="utf-8"))[who]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"who={who}\nface=presenters/{p['face']}\nvoice={p['voice']}\n")
          open("line.txt", "w", encoding="utf-8").write(text)
          print(who, p, text)
          EOF

      - name: Cache Kokoro voice model
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0

      - name: Speak the line (saved voice)
        env:
          VOICE: ${{ steps.job.outputs.voice }}
        run: |
          mkdir -p "$KOKORO_DIR"
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -f "$KOKORO_DIR/kokoro-v1.0.onnx" ] || curl -fsSL -o "$KOKORO_DIR/kokoro-v1.0.onnx" "$base/kokoro-v1.0.onnx"
          [ -f "$KOKORO_DIR/voices-v1.0.bin" ]  || curl -fsSL -o "$KOKORO_DIR/voices-v1.0.bin"  "$base/voices-v1.0.bin"
          python -m venv "$RUNNER_TEMP/tts"
          "$RUNNER_TEMP/tts/bin/pip" install -q kokoro-onnx soundfile
          "$RUNNER_TEMP/tts/bin/python" -c "import voices; voices.save('$VOICE', open('line.txt', encoding='utf-8').read(), 'line.wav')"
          ls -la line.wav

      - name: Get SadTalker
        run: |
          git clone -q --depth 1 https://github.com/OpenTalker/SadTalker.git "$RUNNER_TEMP/SadTalker"
          python -m venv "$RUNNER_TEMP/st"
          pip="$RUNNER_TEMP/st/bin/pip"
          $pip install -q --upgrade pip wheel setuptools
          $pip install -q torch==2.0.1 torchvision==0.15.2 --index-url https://download.pytorch.org/whl/cpu
          $pip install -q numpy==1.23.4 face_alignment==1.3.5 imageio==2.19.3 imageio-ffmpeg==0.4.7 librosa==0.9.2 \
            numba resampy==0.3.1 pydub==0.25.1 scipy==1.10.1 kornia==0.6.8 tqdm yacs==0.1.8 pyyaml joblib==1.1.0 \
            scikit-image==0.19.3 facexlib==0.3.0 av safetensors
          $pip install -q --no-build-isolation basicsr==1.4.2 gfpgan
          "$RUNNER_TEMP/st/bin/python" -c "import torch, basicsr, gfpgan, face_alignment; print('SadTalker deps OK', torch.__version__)"

      - name: Cache SadTalker models
        uses: actions/cache@v4
        with:
          path: st_models
          key: sadtalker-0.0.2-256

      - name: Download SadTalker models
        run: |
          mkdir -p st_models/checkpoints st_models/gfpgan/weights
          r=https://github.com/OpenTalker/SadTalker/releases/download/v0.0.2-rc
          for f in mapping_00109-model.pth.tar mapping_00229-model.pth.tar SadTalker_V0.0.2_256.safetensors; do
            [ -f st_models/checkpoints/$f ] || curl -fsSL -o st_models/checkpoints/$f $r/$f
          done
          w=st_models/gfpgan/weights
          [ -f $w/alignment_WFLW_4HG.pth ] || curl -fsSL -o $w/alignment_WFLW_4HG.pth https://github.com/xinntao/facexlib/releases/download/v0.1.0/alignment_WFLW_4HG.pth
          [ -f $w/detection_Resnet50_Final.pth ] || curl -fsSL -o $w/detection_Resnet50_Final.pth https://github.com/xinntao/facexlib/releases/download/v0.1.0/detection_Resnet50_Final.pth
          [ -f $w/GFPGANv1.4.pth ] || curl -fsSL -o $w/GFPGANv1.4.pth https://github.com/TencentARC/GFPGAN/releases/download/v1.3.0/GFPGANv1.4.pth
          [ -f $w/parsing_parsenet.pth ] || curl -fsSL -o $w/parsing_parsenet.pth https://github.com/xinntao/facexlib/releases/download/v0.2.2/parsing_parsenet.pth
          cp -r st_models/checkpoints st_models/gfpgan "$RUNNER_TEMP/SadTalker/"
          du -sh st_models

      - name: Animate the portrait
        env:
          FACE: ${{ steps.job.outputs.face }}
        run: |
          cd "$RUNNER_TEMP/SadTalker"
          set +e
          "$RUNNER_TEMP/st/bin/python" inference.py --driven_audio "$GITHUB_WORKSPACE/line.wav" \
            --source_image "$GITHUB_WORKSPACE/$FACE" --result_dir "$RUNNER_TEMP/result" \
            --still --preprocess full --enhancer gfpgan --size 256 --cpu 2>&1 | tee "$RUNNER_TEMP/talk.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" != 0 ]; then
            # surface the error as annotations (readable without signing in)
            grep -v "it/s\]" "$RUNNER_TEMP/talk.log" | tail -12 | while IFS= read -r l; do echo "::error::${l:0:300}"; done
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/talk_out"
          cp "$(ls -t $(find "$RUNNER_TEMP/result" -name '*.mp4') | head -1)" "$GITHUB_WORKSPACE/talk_out/${{ steps.job.outputs.who }}_test.mp4"
          ls -la "$GITHUB_WORKSPACE/talk_out"

      - uses: actions/upload-artifact@v4
        with:
          name: talking-test
          path: talk_out/

      - name: Save on the talk-tests branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -r talk_out "$RUNNER_TEMP/talk_out"
          git switch --orphan talk-tests
          git rm -rq --cached . 2>/dev/null || true
          git clean -fdq -e st_models -e models
          cp "$RUNNER_TEMP"/talk_out/*.mp4 .
          git add *.mp4
          git commit -qm "Talking presenter test: ${{ steps.job.outputs.who }}"
          git push -qf origin talk-tests
          echo "Saved on branch talk-tests" >> "$GITHUB_STEP_SUMMARY"
