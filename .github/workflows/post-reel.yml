name: Post reel to Instagram

# Runs every day at 02:30 UTC = 8:00 am IST and posts that day's reel.
# post_reel.py works out the day from START_DATE and does nothing outside the 11-day series.
# GitHub can start scheduled runs a few minutes late at busy times.
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "Post a specific day (1-11). Leave empty for today's."
        required: false
      dry_run:
        description: "Only print what would be posted"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
      START_DATE: ${{ vars.START_DATE }}
      GRAPH_BASE: ${{ vars.GRAPH_BASE || 'https://graph.facebook.com/v24.0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check secrets
        if: ${{ !inputs.dry_run }}
        run: |
          [ -n "$INSTAGRAM_ACCESS_TOKEN" ] || { echo "::error::Add the INSTAGRAM_ACCESS_TOKEN repository secret"; exit 1; }
          [ -n "$IG_USER_ID" ] || { echo "::error::Add the IG_USER_ID repository secret"; exit 1; }

      - name: Post
        env:
          DAY: ${{ inputs.day }}
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: python post_reel.py ${DAY:+--day "$DAY"} $DRY
